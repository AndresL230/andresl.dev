    <text x="860" y="596" font-size="11" fill="#9BBD93">human verification</text>
    <text x="860" y="616" font-size="11" fill="#6E9079">values confirmed before use</text>
  </g>
  <line x1="1152" y1="574" x2="1212" y2="574" stroke="#BAD4AC" stroke-width="1.5" marker-end="url(#arrSage)"/>

