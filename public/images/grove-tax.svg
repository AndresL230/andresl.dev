    <text x="100" y="616" font-size="11" fill="#6E9079">unstructured input</text>
  </g>
  <line x1="392" y1="574" x2="452" y2="574" stroke="#BAD4AC" stroke-width="1.5" marker-end="url(#arrSage)"/>

