    <rect x="460" y="234" width="300" height="120" stroke="#BAD4AC" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="460" y="234" width="46" height="22" fill="#BAD4AC"/>
    <text x="483" y="250" font-size="11" letter-spacing="1" fill="#1C4A3B" text-anchor="middle" font-weight="700">A02</text>
