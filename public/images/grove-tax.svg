    <text x="100" y="336" font-size="11" fill="#6E9079">stripe connect</text>
  </g>
  <line x1="392" y1="294" x2="452" y2="294" stroke="#BAD4AC" stroke-width="1.5" marker-end="url(#arrSage)"/>

  <!-- A02 payments -->
