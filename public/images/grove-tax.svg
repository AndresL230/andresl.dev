  <g>
    <rect x="460" y="514" width="300" height="120" stroke="#BAD4AC" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="460" y="514" width="46" height="22" fill="#BAD4AC"/>
    <text x="483" y="530" font-size="11" letter-spacing="1" fill="#1C4A3B" text-anchor="middle" font-weight="700">B02</text>
    <text x="480" y="570" font-size="17" letter-spacing="0.5" fill="#EAF3E3" font-weight="500">EXTRACTION</text>
    <text x="480" y="596" font-size="11" fill="#9BBD93">google gemini · aws</text>
    <text x="480" y="616" font-size="11" fill="#6E9079">structured fields</text>
  </g>
  <line x1="772" y1="574" x2="832" y2="574" stroke="#BAD4AC" stroke-width="1.5" marker-end="url(#arrSage)"/>

  <!-- B03 reviewer verification (human gate) -->
