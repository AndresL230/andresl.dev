  <g>
    <rect x="1220" y="500" width="300" height="120" stroke="#1c1814" stroke-width="1.5"/>
    <rect x="1220" y="500" width="46" height="22" fill="#dd5a22"/>
    <text x="1243" y="516" font-size="11" letter-spacing="1" fill="#fdfcf7" text-anchor="middle" font-weight="600">B04</text>
    <text x="1240" y="556" font-size="17" letter-spacing="0.5" fill="#1c1814" font-weight="500">RETURN CALC</text>
    <text x="1240" y="582" font-size="11" fill="#4f4a44">downstream calculations</text>
    <text x="1240" y="602" font-size="11" fill="#8c867b">return-ready data</text>
  </g>

  <text x="80" y="662" font-size="11" letter-spacing="1" fill="#8c867b">values verified before they reach return calculations</text>

  <!-- ============== FOOTER STRIP ============== -->
  <g>
    <rect x="80" y="720" width="1440" height="60" stroke="#1c1814" stroke-dasharray="3 3"/>
    <text x="100" y="744" font-size="11" letter-spacing="2" fill="#dd5a22" font-weight="600">// SHIPPED</text>
    <text x="200" y="744" font-size="14" fill="#1c1814" font-weight="500">3 tax-return delivery flows</text>
    <text x="100" y="766" font-size="10" letter-spacing="1" fill="#8c867b">core service modules refactored · clearer separation of concerns · maintainability</text>
    <text x="1500" y="756" font-size="11" letter-spacing="2" fill="#8c867b" text-anchor="end">software engineer intern</text>
  </g>

  <!-- corner registration marks -->
  <g stroke="#1c1814" stroke-width="1">
    <line x1="40" y1="40" x2="60" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="60"/>
    <line x1="1540" y1="40" x2="1560" y2="40"/>
    <line x1="1560" y1="40" x2="1560" y2="60"/>
    <line x1="40" y1="960" x2="60" y2="960"/>
    <line x1="40" y1="940" x2="40" y2="960"/>
    <line x1="1540" y1="960" x2="1560" y2="960"/>
    <line x1="1560" y1="940" x2="1560" y2="960"/>
  </g>
