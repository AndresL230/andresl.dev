  <text x="80" y="676" font-size="11" letter-spacing="1" fill="#6E9079">values verified before they reach return calculations</text>

  <!-- ============== FOOTER STRIP ============== -->
  <g>
    <rect x="80" y="734" width="1440" height="60" stroke="#BAD4AC" stroke-opacity="0.4" stroke-dasharray="3 3"/>
    <text x="100" y="758" font-size="11" letter-spacing="2" fill="#D8EACD" font-weight="600">// SHIPPED</text>
    <text x="200" y="758" font-size="14" fill="#EAF3E3" font-weight="500">3 tax-return delivery flows</text>
    <text x="100" y="780" font-size="10" letter-spacing="1" fill="#7FA588">core service modules refactored · clearer separation of concerns · maintainability</text>
    <text x="1500" y="770" font-size="11" letter-spacing="2" fill="#7FA588" text-anchor="end">jul 2026 — present</text>
  </g>

