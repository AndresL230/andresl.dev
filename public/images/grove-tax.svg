  <g>
    <rect x="80" y="514" width="300" height="120" stroke="#BAD4AC" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="80" y="514" width="46" height="22" fill="#BAD4AC"/>
    <text x="103" y="530" font-size="11" letter-spacing="1" fill="#1C4A3B" text-anchor="middle" font-weight="700">B01</text>
