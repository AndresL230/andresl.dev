  <g stroke="#BAD4AC" stroke-opacity="0.5" stroke-width="1">
    <line x1="40" y1="40" x2="60" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="60"/>
    <line x1="1540" y1="40" x2="1560" y2="40"/>
    <line x1="1560" y1="40" x2="1560" y2="60"/>
    <line x1="40" y1="960" x2="60" y2="960"/>
    <line x1="40" y1="940" x2="40" y2="960"/>
    <line x1="1540" y1="960" x2="1560" y2="960"/>
    <line x1="1560" y1="940" x2="1560" y2="960"/>
  </g>
</svg>
