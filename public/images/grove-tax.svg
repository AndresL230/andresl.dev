<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" fill="none">
  <defs>
    <marker id="arrSage" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#BAD4AC"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#BAD4AC" stroke-width="0.5" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Grove forest-green ground + grid -->
  <rect width="1600" height="1000" fill="#1C4A3B"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- faint pine watermark, far right -->
  <g fill="#BAD4AC" opacity="0.05" transform="translate(1230,150) scale(2.9)">
    <path d="M60,10 Q76.1,34 86,58 L34,58 Q43.9,34 60,10 Z"/>
    <path d="M60,40 Q83.6,67.5 98,95 L22,95 Q36.4,67.5 60,40 Z"/>
    <path d="M60,74 Q91,103 110,132 L10,132 Q29,103 60,74 Z"/>
    <rect x="52" y="132" width="16" height="18"/>
    <circle cx="24" cy="26" r="5"/>
    <circle cx="96" cy="26" r="5"/>
  </g>

  <!-- ============== HEADER: Grove lockup ============== -->
  <!-- pine mark -->
  <g fill="#BAD4AC" transform="translate(80,38) scale(0.42)">
    <path d="M60,10 Q76.1,34 86,58 L34,58 Q43.9,34 60,10 Z"/>
    <path d="M60,40 Q83.6,67.5 98,95 L22,95 Q36.4,67.5 60,40 Z"/>
    <path d="M60,74 Q91,103 110,132 L10,132 Q29,103 60,74 Z"/>
    <rect x="52" y="132" width="16" height="18"/>
    <circle cx="24" cy="26" r="5"/>
    <circle cx="96" cy="26" r="5"/>
  </g>

  <!-- wordmark -->
  <text x="150" y="92" font-family="'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="48" font-weight="600" letter-spacing="-1" fill="#D8EACD">Grove<tspan fill="#7FA588" font-weight="500"> Tax</tspan></text>
  <text x="152" y="126" font-size="13" letter-spacing="2" fill="#9BBD93">AI workforce for tax firms  ·  software engineer intern</text>

  <!-- right meta -->
  <text x="1520" y="72" font-size="14" letter-spacing="3" fill="#D8EACD" text-anchor="end" font-weight="500">FIG. 00 / SYSTEMS</text>
  <text x="1520" y="96" font-size="11" letter-spacing="2" fill="#7FA588" text-anchor="end">grove.tax · a16z speedrun</text>

  <line x1="80" y1="152" x2="1520" y2="152" stroke="#BAD4AC" opacity="0.22"/>

