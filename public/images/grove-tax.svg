<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" fill="none">
  <defs>
    <marker id="arrAcc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dd5a22"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1c1814" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- background + grid -->
  <rect width="1600" height="1000" fill="#f4f2ec"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>

  <!-- header -->
  <g fill="#1c1814">
    <text x="80" y="82" font-size="20" letter-spacing="3" font-weight="500">GROVE TAX  ·  PLATFORM SYSTEMS</text>
    <text x="80" y="108" font-size="13" letter-spacing="2" opacity="0.55">stripe connect payments  ·  gemini document extraction  ·  reviewer-gated return data</text>
    <text x="1520" y="82" font-size="14" letter-spacing="3" fill="#dd5a22" text-anchor="end" font-weight="500">FIG. 00 / SYSTEMS</text>
    <text x="1520" y="108" font-size="11" letter-spacing="2" text-anchor="end" opacity="0.55">live · grove.tax · a16z speedrun</text>
  </g>
  <line x1="80" y1="128" x2="1520" y2="128" stroke="#1c1814" opacity="0.18"/>

  <!-- ============== LANE A: PAYMENTS ============== -->
  <text x="100" y="188" font-size="10" letter-spacing="3" fill="#8c867b" font-weight="500">/ PAYMENTS · STRIPE CONNECT</text>

  <!-- A01 onboarding -->
  <g>
    <rect x="80" y="210" width="300" height="120" stroke="#1c1814" stroke-width="1.5"/>
