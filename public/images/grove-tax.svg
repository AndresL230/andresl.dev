  <g>
    <rect x="840" y="210" width="300" height="120" stroke="#1c1814" stroke-width="1.5"/>
    <rect x="840" y="210" width="46" height="22" fill="#dd5a22"/>
    <text x="863" y="226" font-size="11" letter-spacing="1" fill="#fdfcf7" text-anchor="middle" font-weight="600">A03</text>
