  <text x="100" y="478" font-size="10" letter-spacing="3" fill="#8c867b" font-weight="500">/ DOCUMENT INTELLIGENCE · GEMINI ON AWS</text>

  <!-- B01 source docs -->
  <g>
    <rect x="80" y="500" width="300" height="120" stroke="#1c1814" stroke-width="1.5"/>
    <rect x="80" y="500" width="46" height="22" fill="#dd5a22"/>
    <text x="103" y="516" font-size="11" letter-spacing="1" fill="#fdfcf7" text-anchor="middle" font-weight="600">B01</text>
    <text x="100" y="556" font-size="17" letter-spacing="0.5" fill="#1c1814" font-weight="500">SOURCE DOCS</text>
    <text x="100" y="582" font-size="11" fill="#4f4a44">taxpayer documents</text>
    <text x="100" y="602" font-size="11" fill="#8c867b">unstructured input</text>
  </g>
  <line x1="392" y1="560" x2="452" y2="560" stroke="#dd5a22" stroke-width="1.5" marker-end="url(#arrAcc)"/>

