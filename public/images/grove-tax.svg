  <g>
    <rect x="1220" y="514" width="300" height="120" stroke="#BAD4AC" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="1220" y="514" width="46" height="22" fill="#BAD4AC"/>
    <text x="1243" y="530" font-size="11" letter-spacing="1" fill="#1C4A3B" text-anchor="middle" font-weight="700">B04</text>
    <text x="1240" y="570" font-size="17" letter-spacing="0.5" fill="#EAF3E3" font-weight="500">RETURN CALC</text>
    <text x="1240" y="596" font-size="11" fill="#9BBD93">downstream calculations</text>
    <text x="1240" y="616" font-size="11" fill="#6E9079">return-ready data</text>
