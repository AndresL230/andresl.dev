    <text x="863" y="250" font-size="11" letter-spacing="1" fill="#1C4A3B" text-anchor="middle" font-weight="700">A03</text>
    <text x="860" y="290" font-size="17" letter-spacing="0.5" fill="#EAF3E3" font-weight="500">WEBHOOKS</text>
    <text x="860" y="316" font-size="11" fill="#9BBD93">stripe event handling</text>
    <text x="860" y="336" font-size="11" fill="#6E9079">async state sync</text>
  </g>
  <line x1="1152" y1="294" x2="1212" y2="294" stroke="#BAD4AC" stroke-width="1.5" marker-end="url(#arrSage)"/>

