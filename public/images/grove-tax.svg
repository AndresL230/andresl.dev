  <text x="100" y="212" font-size="10" letter-spacing="3" fill="#7FA588" font-weight="500">/ PAYMENTS · STRIPE CONNECT</text>

  <!-- A01 onboarding -->
  <g>
    <rect x="80" y="234" width="300" height="120" stroke="#BAD4AC" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="80" y="234" width="46" height="22" fill="#BAD4AC"/>
    <text x="103" y="250" font-size="11" letter-spacing="1" fill="#1C4A3B" text-anchor="middle" font-weight="700">A01</text>
