    <rect x="460" y="500" width="300" height="120" stroke="#1c1814" stroke-width="1.5"/>
    <rect x="460" y="500" width="46" height="22" fill="#dd5a22"/>
    <text x="483" y="516" font-size="11" letter-spacing="1" fill="#fdfcf7" text-anchor="middle" font-weight="600">B02</text>
