    <text x="103" y="226" font-size="11" letter-spacing="1" fill="#fdfcf7" text-anchor="middle" font-weight="600">A01</text>
    <text x="100" y="266" font-size="17" letter-spacing="0.5" fill="#1c1814" font-weight="500">ONBOARDING</text>
    <text x="100" y="292" font-size="11" fill="#4f4a44">connected-account setup</text>
    <text x="100" y="312" font-size="11" fill="#8c867b">stripe connect</text>
  </g>
  <line x1="392" y1="270" x2="452" y2="270" stroke="#dd5a22" stroke-width="1.5" marker-end="url(#arrAcc)"/>

  <!-- A02 payments -->
  <g>
    <rect x="460" y="210" width="300" height="120" stroke="#1c1814" stroke-width="1.5"/>
    <rect x="460" y="210" width="46" height="22" fill="#dd5a22"/>
    <text x="483" y="226" font-size="11" letter-spacing="1" fill="#fdfcf7" text-anchor="middle" font-weight="600">A02</text>
    <text x="480" y="266" font-size="17" letter-spacing="0.5" fill="#1c1814" font-weight="500">PAYMENTS</text>
    <text x="480" y="292" font-size="11" fill="#4f4a44">client tax preparation</text>
    <text x="480" y="312" font-size="11" fill="#8c867b">charges</text>
  </g>
  <line x1="772" y1="270" x2="832" y2="270" stroke="#dd5a22" stroke-width="1.5" marker-end="url(#arrAcc)"/>

